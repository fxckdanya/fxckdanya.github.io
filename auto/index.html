<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Автоветка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Russo+One&display=swap">
<style>
/* Концепция: синька инженера и ветка исследований из танковой игры. Одна тема, тёмная по замыслу. */
:root{
  color-scheme:dark;
  --bg:#0f2433; --bg2:#132c3e; --line:#2b4c63; --line2:#3f6780;
  --fg:#e6eef3; --mut:#9db4c3; --hot:#ff8f33; --hot-ink:#1c1206; --link:#8ed0f2;
  --stop:#ff7468; --care:#f1c35c; --ok:#79d4a4;
  --disp:"Russo One","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);display:flex;flex-direction:column;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.lab{font:500 11px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.top{border-bottom:1px solid var(--line);background:var(--bg2);display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font:18px/1 var(--disp);letter-spacing:.03em}
.logo b{color:var(--hot);font-weight:400}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 6px;font:13px/1.4 var(--mono);color:var(--mut);min-width:0}
.crumbs button{color:var(--link)}
.crumbs button:hover{text-decoration:underline}
main{flex:1;min-height:0;display:flex;flex-direction:column}

/* Дерево */
.tree{display:grid;grid-template-columns:190px minmax(0,1fr);flex:1}
.nations{border-right:1px solid var(--line);padding:18px 0;display:flex;flex-direction:column;gap:2px}
.nations .lab{padding:0 16px 8px max(16px,env(safe-area-inset-left,0px))}
.nation{display:flex;align-items:center;gap:10px;padding:9px 16px 9px max(16px,env(safe-area-inset-left,0px));border-left:3px solid transparent;color:var(--mut)}
.nation i{font:500 12px var(--mono);font-style:normal;width:26px;text-align:center;border:1px solid var(--line2);padding:1px 0}
.nation:hover{background:var(--bg2);color:var(--fg)}
.nation[aria-current=true]{background:var(--bg2);color:var(--fg);border-left-color:var(--hot)}
.nation small{margin-left:auto;font:11px var(--mono);color:var(--mut)}
.branch{padding-block:20px 32px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px;min-width:0}
.tier h2{font:20px/1.2 var(--disp);margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.tile{width:172px;background:var(--bg2);border:1px solid var(--line2);padding:11px 13px;display:flex;flex-direction:column;gap:3px;border-radius:2px}
.tile strong{font:400 17px/1.2 var(--disp)}
.tile span{font-size:12.5px;color:var(--mut)}
.tile:hover:not(:disabled){border-color:var(--hot)}
.tile[aria-current=true]{border-color:var(--hot);box-shadow:inset 0 0 0 1px var(--hot)}
.tile:disabled{opacity:.5;cursor:default;border-style:dashed}
.note{color:var(--mut);max-width:68ch;font-size:14px}
.chain-wrap{overflow-x:auto;padding-bottom:6px}
.chain{display:flex;gap:30px;width:max-content;list-style:none;margin:0;padding:0}
.chain li{position:relative}
.chain li+li::before{content:"";position:absolute;left:-30px;top:50%;width:24px;border-top:2px solid var(--line2)}
.chain li+li::after{content:"";position:absolute;left:-10px;top:calc(50% - 5px);border-left:8px solid var(--line2);border-top:6px solid transparent;border-bottom:6px solid transparent}
.gen{width:184px;background:var(--bg2);border:1px solid var(--line2);padding:10px 12px 12px;display:grid;gap:3px;border-radius:2px}
.gen:hover{border-color:var(--hot);background:#17344a}
.gen .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gen .tn{font:22px/1 var(--disp);color:var(--hot)}
.gen .code{font:500 13px var(--mono);color:var(--fg)}
.gen svg{width:100%;height:auto;display:block;margin:4px 0 2px}
.gen svg path,.gen svg circle{fill:var(--line2)}
.gen .y{font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.gen .st{font-size:12px;color:var(--mut)}
.gen .st.full{color:var(--hot)}
.foot{border-top:1px solid var(--line);color:var(--mut);font-size:13px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Машина */
.car{display:grid;grid-template-columns:minmax(0,1fr) 420px;flex:1;min-height:0}
.stage{position:relative;min-height:0;background:var(--bg);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.zones{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.zones button{pointer-events:auto;background:rgba(19,44,62,.92);border:1px solid var(--line2);padding:6px 11px;font-size:13px;border-radius:2px}
.zones button:hover{border-color:var(--fg)}
.zones button[aria-pressed=true]{background:var(--hot);color:var(--hot-ink);border-color:var(--hot);font-weight:600}
.stamp{position:absolute;right:12px;bottom:12px;border:1px solid var(--line2);background:rgba(15,36,51,.88);font:11px/1.45 var(--mono);padding:6px 9px;color:var(--mut);pointer-events:none;max-width:60%}
.stamp b{display:block;color:var(--fg);font-weight:500}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-size:12px;color:var(--mut);pointer-events:none;max-width:36%}
#tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:500;padding:2px 7px;border-radius:2px;white-space:nowrap;transform:translate(10px,-26px)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mut)}
.panel{border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);flex:none}
.tabs button{padding:12px 8px;text-align:center;font:15px var(--disp);color:var(--mut);border-bottom:3px solid transparent}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--hot)}
.pbody{overflow-y:auto;flex:1;min-height:0;padding-block:14px 22px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.pbody>*{min-width:0;flex:none}
.gname{font:21px/1.2 var(--disp)}
.gyears{font:500 14px var(--mono);color:var(--hot)}
details.facts{border:1px solid var(--line);padding:8px 11px}
details.facts summary{cursor:pointer;font-size:13.5px;color:var(--link)}
.dl{display:grid;gap:7px;margin-top:9px;font-size:13.5px}
.dl div span{display:block}
.banner{border:1px solid var(--line2);padding:9px 11px;font-size:13.5px}
.banner.warn{border-color:var(--care)}
.banner.stop{border-color:var(--stop)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:3px 8px;font-size:12.5px;border-radius:2px;color:var(--mut)}
.chip i{width:9px;height:9px;background:var(--c);display:block;flex:none}
.chip[aria-pressed=true]{color:var(--fg);border-color:var(--line2)}
.chip[aria-pressed=false] i{background:none;box-shadow:inset 0 0 0 1px var(--c)}
input[type=search]{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line2);color:var(--fg);font:14px var(--body);padding:8px 10px;border-radius:2px}
input::placeholder{color:var(--mut)}
.plist{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.plist button{background:var(--bg2);padding:7px 10px;display:flex;align-items:center;gap:9px;font-size:14px;width:100%;box-sizing:border-box}
.plist button:hover{background:#1b3a50}
.plist i{width:9px;height:9px;background:var(--c);flex:none}
.plist small{margin-left:auto;font:12px var(--mono);color:var(--mut);flex:none}
.back{color:var(--link);font-size:13.5px}
.back:hover{text-decoration:underline}
.pname{font:20px/1.2 var(--disp)}
.sect{display:grid;gap:5px}
.sect ul,.sect ol{margin:0;padding-left:19px;display:grid;gap:4px;font-size:14px}
.sect p{margin:0;font-size:14px}
.conn{display:grid;gap:4px}
.conn button{border:1px solid var(--line);padding:6px 9px;font-size:13.5px;width:100%;box-sizing:border-box}
.conn button:hover{border-color:var(--hot)}
.conn small{display:block;color:var(--mut);font-size:12.5px}
.sym{display:grid;gap:6px}
.sym>button{border:1px solid var(--line);padding:9px 11px;display:grid;gap:3px;width:100%;box-sizing:border-box}
.sym>button:hover{border-color:var(--hot)}
.sev{font:500 11px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.sev.stop{color:var(--stop)}.sev.care{color:var(--care)}.sev.ok{color:var(--ok)}
.src{font-size:12.5px;color:var(--mut)}
.gen img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;margin:5px 0 3px;background:var(--bg)}
.photo{position:absolute;inset:0;container-type:size;display:grid;place-items:center;background:#0a1a25}
.photo>img{width:100%;height:100%;object-fit:contain;display:block}
.pwrap{position:relative;width:min(100cqw,calc(100cqh*var(--r)));aspect-ratio:var(--r)}
.pwrap img{width:100%;height:100%;display:block}
.spot{position:absolute;transform:translate(-9px,-9px);display:flex;align-items:center;gap:6px;white-space:nowrap}
.spot i{width:18px;height:18px;border-radius:50%;background:var(--hot);border:3px solid #fff;box-sizing:border-box;box-shadow:0 0 0 2px rgba(0,0,0,.55);flex:none}
.spot span{background:rgba(10,26,37,.88);color:#fff;font-size:12.5px;padding:2px 7px;border-radius:2px}
.spot.flip{flex-direction:row-reverse;transform:translate(calc(-100% + 9px),-9px)}
.spot:hover span{background:var(--hot);color:var(--hot-ink)}
.cap{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;right:12px;font-size:12.5px;color:#e6eef3;pointer-events:none}
.cap span{background:rgba(10,26,37,.86);padding:3px 8px;display:inline-block;max-width:100%;box-sizing:border-box}
.cap a{pointer-events:auto}
.mode{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:52px;display:flex}
.mode button{background:rgba(19,44,62,.92);border:1px solid var(--line2);padding:5px 10px;font-size:12.5px}
.mode button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.plist img{width:44px;height:32px;object-fit:cover;flex:none;display:block;background:var(--bg)}
.plist .noimg{width:44px;height:32px;flex:none;display:grid;place-items:center;border:1px dashed var(--line2);box-sizing:border-box}
.conn button{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:9px;align-items:center}
.conn img{width:52px;height:38px;object-fit:cover;grid-row:span 2;display:block}
.conn small{grid-column:2}
.conn button>span{grid-column:2}
.credits{padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-width:900px}
.credits h1{font:22px/1.2 var(--disp)}
.credits ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13.5px}
.footlink{color:var(--link);text-decoration:underline}
@media (max-width:640px){.spot span{display:none}}
@media (max-width:900px){
  html,body{height:auto}
  .car{display:flex;flex-direction:column}
  .stage{height:56vh;min-height:320px;flex:none}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .pbody{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .hint{display:none}
  .stamp{max-width:calc(100% - 24px)}
}
@media (max-width:640px){
  .tree{display:block}
  .nations{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0}
  .nations .lab{display:none}
  .nation{flex:none;padding:10px 12px;border-left:0;border-bottom:3px solid transparent}
  .nation[aria-current=true]{border-left:0;border-bottom-color:var(--hot)}
  .nation small{display:none}
  .branch{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .tile{width:calc(50% - 5px);box-sizing:border-box}
  .chain{flex-direction:column;width:100%;gap:22px}
  .gen{width:100%;box-sizing:border-box}
  .gen svg{max-width:190px}
  .chain li+li::before{left:50%;top:-22px;width:0;height:16px;border-top:0;border-left:2px solid var(--line2)}
  .chain li+li::after{left:calc(50% - 5px);top:-8px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--line2);border-bottom:0}
}
</style>

</header>
<main id="app"></main>

const inZone=id=>state.zone==="all"||PARTS[id].z.split(" ").includes(state.zone);
function applyVisibility(){if(scene)scene.visible=new Set(Object.keys(PARTS).filter(id=>inZone(id)&&!state.off.has(PARTS[id].s)));syncHi()}
function syncHi(){renderPhoto();const ss=$("#stampSel");if(ss)ss.textContent=state.part?PARTS[state.part].n:"Типовая схема, без масштаба";if(!scene)return;const hi=new Map();if(state.part){(LINKS[state.part]||[]).forEach(([t])=>hi.set(t,1));scene.sel=state.part}else scene.sel=null;
 if(state.sym&&!state.part){symById(state.sym).p.forEach(id=>hi.set(id,2))}
 if(state.part)scene.visible.add(state.part);
 if(state.sym&&!state.part)symById(state.sym).p.forEach(id=>scene.visible.add(id));
 scene.hi=hi;scene.dirty=true}
const symById=id=>SYMPTOMS.find(s=>s.id===id);
function setTab(t){state.tab=t;state.part=null;state.sym=null;$("#t-build").setAttribute("aria-selected",t==="build");$("#t-repair").setAttribute("aria-selected",t==="repair");applyVisibility();renderPanel()}
function selectPart(id){state.part=id;if(scene)scene.spin=false;applyVisibility();renderPanel();const b=$("#pb");if(b)b.scrollTop=0}
function srcHTML(keys){return `<p class="src">Источники: ${keys.map(k=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener">${SRC[k][0]}</a>`).join(", ")}</p>`}
function genHead(){const g=state.gen,md=modelOf(makeOf(findNat(state.nat),state.make),state.model);return `<div><h1 class="gname">${md.n} ${g.tier} · ${g.code}</h1><div class="gyears">${g.y}</div></div>
 <details class="facts"><summary>Кузова, моторы, источники</summary><div class="dl"><div><span class="lab">Кузов</span><span>${g.body}</span></div><div><span class="lab">Моторы</span><span>${g.eng}</span></div>${g.drive?`<div><span class="lab">Привод ГРМ</span><span>${g.drive}</span></div>`:""}${g.note?`<div><span class="lab">Замечание</span><span>${g.note}</span></div>`:""}</div>${srcHTML(g.src)}</details>`}
function renderPanel(){const pb=$("#pb");if(!pb)return;if(state.tab==="repair")renderRepair(pb);else renderBuild(pb)}
function renderBuild(pb){
 if(state.part){pb.innerHTML=partHTML(state.part,"Все детали");wirePart(pb);return}
 const g=state.gen;const list=Object.keys(PARTS).filter(id=>inZone(id)&&!state.off.has(PARTS[id].s)&&PARTS[id].n.toLowerCase().includes(state.q.toLowerCase()));
 pb.innerHTML=`${genHead()}
 ${g.notes?"":`<div class="banner warn">Для этого поколения проверены только годы и моторы. Устройство показано на примерах и может отличаться.</div>`}
 <div class="chips" aria-label="Системы">${Object.keys(SYS).map(k=>`<button class="chip" data-s="${k}" aria-pressed="${!state.off.has(k)}" style="--c:${SYS[k][1]}"><i></i>${SYS[k][0]}</button>`).join("")}</div>
 <label><span class="lab" style="display:block;margin-bottom:4px">Найти деталь</span><input type="search" id="q" value="${state.q}" placeholder="Например, помпа"></label>
 <div><div class="lab" style="margin-bottom:5px">Показано деталей: ${list.length}</div>${list.length?`<div class="plist">${list.map(id=>`<button data-p="${id}" style="--c:${SYS[PARTS[id].s][1]}">${PH[id]?`<img src="${imgURL(id,330)}" alt="" loading="lazy">`:`<span class="noimg"><i></i></span>`}${PARTS[id].n}${g.notes&&g.notes[id]?"<small>заметка</small>":""}</button>`).join("")}</div>`:`<p class="note">Ничего не нашлось. Включите системы выше или измените запрос.</p>`}</div>`;
 pb.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const k=b.dataset.s;state.off.has(k)?state.off.delete(k):state.off.add(k);applyVisibility();renderPanel()});
 pb.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>selectPart(b.dataset.p));
 const q=$("#q");q.oninput=()=>{state.q=q.value;const pos=q.selectionStart;renderPanel();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
function partHTML(id,back){const p=PARTS[id],g=state.gen,note=g.notes&&g.notes[id];
 return `<button class="back" id="bk">← ${back}</button>
 <div><div class="lab">${SYS[p.s][0]}</div><h2 class="pname">${p.n}</h2></div>
 <div class="sect"><p>${p.d}</p></div>
 ${PH[id]?"":`<p class="src">Проверенного фото этой детали пока нет, поэтому показано не оно.</p>`}
 ${note?`<div class="banner"><div class="lab" style="color:var(--hot);margin-bottom:3px">На этом поколении</div>${note}${srcHTML(["dr","ko"])}</div>`:""}
 ${p.w?`<div class="banner stop">${p.w}</div>`:""}
 ${(LINKS[id]||[]).length?`<div class="sect"><div class="lab">Как соединено</div><div class="conn">${LINKS[id].map(([t,v])=>`<button data-p="${t}">${PH[t]?`<img src="${imgURL(t,330)}" alt="" loading="lazy">`:""}<span>${PARTS[t].n}</span><small>${v}</small></button>`).join("")}</div></div>`:""}
 <div class="sect"><div class="lab">Признаки неисправности</div><ul>${p.f.map(x=>`<li>${x}</li>`).join("")}</ul></div>
 <div class="sect"><div class="lab">Что проверить</div><ul>${p.c.map(x=>`<li>${x}</li>`).join("")}</ul></div>
 <p class="src">Моменты затяжки и артикулы здесь не указаны. Смотрите заводское руководство под ваш VIN.</p>`}
function wirePart(pb){$("#bk",pb).onclick=()=>selectPart(null);pb.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>selectPart(b.dataset.p))}
function renderRepair(pb){
 const g=state.gen;
 if(state.part){pb.innerHTML=partHTML(state.part,state.sym?"К симптому":"К симптомам");wirePart(pb);return}
 if(state.sym){const s=symById(state.sym);pb.innerHTML=`<button class="back" id="bk">← Все симптомы</button>
  <div><div class="sev ${s.sev}">${s.L}</div><h2 class="pname">${s.t}</h2></div>
  <div class="sect"><div class="lab">С чего начать</div><ol>${s.s.map(x=>`<li>${x}</li>`).join("")}</ol></div>
  <div class="sect"><div class="lab">Что смотреть, по порядку</div><div class="conn">${s.p.map(id=>`<button data-p="${id}">${PH[id]?`<img src="${imgURL(id,330)}" alt="" loading="lazy">`:""}<span>${PARTS[id].n}</span><small>${SYS[PARTS[id].s][0]}</small></button>`).join("")}</div></div>
  ${s.g?srcHTML(["dr","ko"]):""}<div class="banner stop">${SAFETY}</div>`;
  $("#bk",pb).onclick=()=>{state.sym=null;applyVisibility();renderPanel()};pb.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>selectPart(b.dataset.p));return}
 const own=SYMPTOMS.filter(s=>s.g&&g.extra&&g.extra.includes(s.id)),gen=SYMPTOMS.filter(s=>!s.g);
 const tile=s=>`<button data-y="${s.id}"><span class="sev ${s.sev}">${s.L}</span><span>${s.t}</span></button>`;
 pb.innerHTML=`${genHead()}<div class="banner stop">${SAFETY}</div>
 ${own.length?`<div class="sect"><div class="lab" style="color:var(--hot)">Известно по этому поколению</div><div class="sym">${own.map(tile).join("")}</div></div>`:""}
 <div class="sect"><div class="lab">Что случилось</div><div class="sym">${gen.map(tile).join("")}</div></div>`;
 pb.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{state.sym=b.dataset.y;state.part=null;if(scene)scene.spin=false;applyVisibility();renderPanel();pb.scrollTop=0})}

$("#home").onclick=()=>go("tree-korea-hyundai-accent");
addEventListener("hashchange",route);
if(!location.hash)history.replaceState(null,"","#tree-korea-hyundai-accent");
route();
</script>
</body></html>
