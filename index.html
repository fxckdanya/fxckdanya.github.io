<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fxckdanya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Макет: одна стеклянная карточка в центре экрана поверх живого потока цветных линий. Единый тёмный образ, задуман без светлой темы. */
:root {
  color-scheme: dark;
  --night: #15103f; --glass: rgba(21, 16, 63, .62); --edge: rgba(255, 255, 255, .22);
  --text: #f4f1ff; --soft: #cfc9ec; --pink: #ff4fa3; --ice: #5fe0ff; --discord: #5865f2;
  --display: "Unbounded", "Arial Black", sans-serif;
  --body: "Onest", system-ui, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font: 400 1rem/1.5 var(--body); }
#flow { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.stage {
  position: relative; min-height: 100%; display: grid; place-items: center;
  padding-block: 2rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  perspective: 900px;
}
.card {
  width: min(100%, 27rem); display: grid; justify-items: center; gap: 1rem; text-align: center;
  padding: 2rem 1.25rem 1.5rem; border: 1px solid var(--edge); border-radius: 1.5rem;
  background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transition: transform .12s linear;
}
.avatar { position: relative; width: 7.5rem; height: 7.5rem; border-radius: 50%; display: grid; place-items: center; overflow: hidden; }
.avatar::before {
  content: ""; position: absolute; inset: -30%;
  background: conic-gradient(var(--pink), var(--ice), var(--pink));
  animation: spin 5s linear infinite;
}
.avatar img, .avatar .letter {
  position: relative; width: calc(100% - 8px); height: calc(100% - 8px); border-radius: 50%;
  object-fit: cover; background: var(--night);
}
.avatar .letter { display: grid; place-items: center; font: 800 2.75rem/1 var(--display); }
@keyframes spin { to { transform: rotate(360deg); } }
.name {
  margin: 0; font: 800 clamp(1.5rem, 7vw, 2.1rem)/1.15 var(--display); overflow-wrap: anywhere;
  background: linear-gradient(90deg, var(--pink), var(--ice)); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.bio { margin: 0; max-width: 22rem; color: var(--soft); }
.status { margin: 0; min-height: 1.5em; font: 500 .9rem/1.5 var(--mono); color: var(--ice); }
.status::after { content: "▌"; margin-left: .1em; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
.iconlink {
  display: grid; place-items: center; width: 4rem; height: 4rem; padding: 0; border: 0; border-radius: 1.1rem;
  background: var(--discord); color: #ffffff; cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.iconlink:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 0 1.5rem var(--discord); }
.iconlink svg { width: 2.3rem; height: 2.3rem; fill: currentColor; }
.hint { margin: 0; font: 500 .85rem/1.4 var(--mono); color: var(--soft); }
.link {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem; width: 100%; min-height: 3rem;
  padding: .5rem 1rem; border: 1px solid var(--edge); border-radius: .75rem;
  background: rgba(255, 255, 255, .07); color: var(--text); font: 600 1rem/1.3 var(--body); text-decoration: none; text-align: left; cursor: pointer;
  transition: background .15s, border-color .15s, transform .15s;
}
.link:hover { background: rgba(255, 255, 255, .16); border-color: var(--ice); transform: translateY(-2px); }
.link small { min-width: 0; overflow-wrap: anywhere; text-align: right; font: 500 .8rem/1.3 var(--mono); color: var(--soft); }
:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .avatar::before, .status::after { animation: none; }
  .card, .link { transition: none; }
}
</style>
</head>
<body>
<canvas id="flow" aria-hidden="true"></canvas>
<main class="stage">
  <article class="card" id="card">
    <div class="avatar" id="avatar"></div>
    <h1 class="name" id="name"></h1>
    <p class="bio" id="bio"></p>
    <p class="status" id="status" aria-label="Статус"></p>
    <nav class="links" id="links" aria-label="Ссылки"></nav>
    <p class="hint" id="hint" role="status" hidden></p>
  </article>
</main>

<script>
(function () {
  'use strict';
  /* Всё, что нужно заменить на своё, находится здесь. */
  var ME = {
    name: 'fxckdanya',
    bio: '',
    avatar: '', /* сюда подставится твоя картинка */
    statuses: [],
    links: [
      { label: 'Discord', icon: 'discord', url: 'https://discord.com/users/1435595573267922974' }
    ]
  };
  var $ = function (id) { return document.getElementById(id); };
  var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ICONS = {
    discord: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/></svg>'
  };

  document.title = ME.name;
  $('name').textContent = ME.name;
  $('bio').textContent = ME.bio;
  $('bio').hidden = !ME.bio;
  var face;
  if (ME.avatar) {
    face = document.createElement('img'); face.src = ME.avatar; face.alt = 'Аватарка ' + ME.name;
  } else {
    face = document.createElement('div'); face.className = 'letter'; face.textContent = ME.name.charAt(0).toUpperCase();
  }
  $('avatar').appendChild(face);

  ME.links.forEach(function (l) {
    var el = document.createElement(l.url ? 'a' : 'button');
    el.className = 'iconlink';
    el.innerHTML = ICONS[l.icon];
    if (l.url) {
      el.href = l.url; el.target = '_blank'; el.rel = 'noopener';
      el.setAttribute('aria-label', 'Открыть профиль ' + l.label);
    } else {
      el.type = 'button';
      el.setAttribute('aria-label', 'Скопировать ник ' + l.label);
      el.addEventListener('click', function () {
        var hint = $('hint');
        var done = function (text) {
          hint.textContent = text; hint.hidden = false;
          setTimeout(function () { hint.hidden = true; }, 2500);
        };
        if (!navigator.clipboard) { done('Ник: ' + l.copy); return; }
        navigator.clipboard.writeText(l.copy).then(function () { done('Ник ' + l.copy + ' скопирован'); }, function () { done('Ник: ' + l.copy); });
      });
    }
    $('links').appendChild(el);
  });

  /* Статус печатается по буквам. */
  var statusEl = $('status');
  statusEl.hidden = !ME.statuses.length;
  statusEl.textContent = ME.statuses[0] || '';
  if (!calm && ME.statuses.length) {
    var si = 0, pos = ME.statuses[0].length, erase = true, hold = 28;
    setInterval(function () {
      if (hold > 0) { hold--; return; }
      var word = ME.statuses[si];
      if (erase) {
        pos--;
        if (pos <= 0) { erase = false; si = (si + 1) % ME.statuses.length; }
      } else {
        pos++;
        if (pos >= word.length) { erase = true; hold = 28; }
      }
      statusEl.textContent = ME.statuses[si].slice(0, Math.max(0, pos));
    }, 70);
  }

  /* Карточка слегка наклоняется за курсором. */
  if (!calm && matchMedia('(hover: hover)').matches) {
    addEventListener('pointermove', function (e) {
      var rx = (e.clientY / innerHeight - .5) * -7, ry = (e.clientX / innerWidth - .5) * 7;
      $('card').style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
    });
  }

  /* Фон: тысячи коротких штрихов текут по невидимому полю, курсор их разгоняет. */
  var canvas = $('flow'), ctx = canvas.getContext('2d'), W = 0, H = 0, dots = [], t = 0;
  var mouse = { x: -9999, y: -9999 };
  function size() {
    var dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#15103f'; ctx.fillRect(0, 0, W, H);
    var count = Math.min(420, Math.round(W * H / 3200));
    dots = [];
    for (var i = 0; i < count; i++) dots.push(spawn({}));
    for (var k = 0; k < 90; k++) step();
  }
  function spawn(d) {
    d.x = Math.random() * W; d.y = Math.random() * H; d.life = 40 + Math.random() * 160;
    return d;
  }
  function step() {
    t += .0016;
    ctx.fillStyle = 'rgba(21, 16, 63, .07)'; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 1.3;
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var a = Math.sin(d.x * .0032 + t * 3) * 2.1 + Math.cos(d.y * .0041 - t * 2) * 2.1 + Math.sin((d.x + d.y) * .0013 + t);
      var nx = d.x + Math.cos(a) * 1.9, ny = d.y + Math.sin(a) * 1.9;
      var mx = d.x - mouse.x, my = d.y - mouse.y, dist = mx * mx + my * my;
      if (dist < 22500) { var f = (22500 - dist) / 22500 * 3.2, len = Math.sqrt(dist) || 1; nx += mx / len * f; ny += my / len * f; }
      var mix = (d.x / W + Math.sin(t * 2) * .25 + .25);
      mix = Math.max(0, Math.min(1, mix));
      var r = Math.round(255 + (95 - 255) * mix), g = Math.round(79 + (224 - 79) * mix), b = Math.round(163 + (255 - 163) * mix);
      ctx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',.88)';
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(nx, ny); ctx.stroke();
      d.x = nx; d.y = ny; d.life--;
      if (d.life <= 0 || d.x < 0 || d.y < 0 || d.x > W || d.y > H) spawn(d);
    }
  }
  function loop() {
    if (!document.hidden) step();
    requestAnimationFrame(loop);
  }
  size();
  var resizeTimer;
  addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(size, 150); });
  addEventListener('pointermove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('pointerleave', function () { mouse.x = mouse.y = -9999; });
  if (!calm) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
